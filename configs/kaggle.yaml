# Full run on a Kaggle GPU with the v2 improvements switched on.
_base_: default.yaml

paths:
  raw_dir: /kaggle/input            # replaced by the detected folder (see the notebook)
  processed_dir: /kaggle/temp/processed
  output_dir: /kaggle/working/outputs/convlstm_internet_v2

data:
  num_workers: 2
  scaler: standard                  # mean/std scaling instead of min-max (losses near 1, not 1e-6)
  time_features: true               # sin/cos time-of-day and day-of-week input channels
  log_transform: true               # log1p before scaling: errors become relative, so busy November and
                                    # quieter December are on one footing (persistence train/val loss
                                    # ratio 1.53 -> 1.09 on real data)

training:
  batch_size: 16
  min_delta_rel: 0.001              # improvements under 0.1% don't reset early-stopping patience
  max_hours: 8.5                    # Kaggle sessions are limited to 12 h; leave time for evaluation
